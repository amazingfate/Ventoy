# Linux installer, Windows installer, and LiveCD ISO.
# The Linux job uses a privileged Debian trixie container. The Windows job
# builds Ventoy2Disk on windows-2022 with the newest MSVC toolset that the
# selected Visual Studio actually ships.
name: Installers

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - refactor/modern-grub-edk2
  pull_request:

jobs:
  linux-and-livecd:
    name: Linux installer and LiveCD
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Debian trixie image
        run: docker build -f build/Dockerfile.trixie -t ventoy-trixie build

      - name: Compile the Linux installer and LiveCD ISO
        run: |
          docker run --rm --privileged \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${{ github.workspace }}:/ventoy" \
            -w /ventoy \
            ventoy-trixie \
            sh build/ci-release.sh

      # Publish each file on its own. A combined zip named after the LiveCD
      # hid the installer, and a multi-path upload can succeed when only the
      # ISO matches. archive:false keeps the real filename as the artifact name.
      - name: Check Linux installer and LiveCD
        run: |
          set -eu
          tarf=$(echo INSTALL/ventoy-*-linux.tar.gz)
          iso=$(echo LiveCDGUI/ventoy-*-livecd.iso)
          test -f "$tarf"
          test -f "$iso"
          ls -lh "$tarf" "$iso"
          echo "LINUX_TAR=$tarf" >> "$GITHUB_ENV"
          echo "LIVE_ISO=$iso" >> "$GITHUB_ENV"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.LINUX_TAR }}
          archive: false
          if-no-files-found: error

      - name: Upload LiveCD ISO
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.LIVE_ISO }}
          archive: false
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: windows-2022
    needs: linux-and-livecd
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download xz-embedded
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $PSNativeCommandUseErrorActionPreference = $false
          $dest = Join-Path (Get-Location) '.cache\upstream\xz-embedded'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $tgz = Join-Path $env:RUNNER_TEMP 'xz-embedded.tar.gz'
          $url = 'https://github.com/tukaani-project/xz-embedded/archive/refs/tags/v2024-12-30.tar.gz'
          & curl.exe -fL --retry 5 --retry-delay 2 -o $tgz $url
          if ($LASTEXITCODE -ne 0) { throw "curl failed: $LASTEXITCODE" }
          & tar.exe -xf $tgz -C $dest --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw "tar failed: $LASTEXITCODE" }
          $src = Join-Path $dest 'linux\lib\decompress_unxz.c'
          if (-not (Test-Path $src)) { throw "missing $src" }
          # git apply rejects this patch after core.autocrlf rewrites it.
          # Export unxz(), and do not compile the pre-boot memmove under MSVC.
          $text = [System.IO.File]::ReadAllText($src)
          $needle = 'STATIC int INIT unxz'
          $changed = $false
          if ($text.Contains($needle)) {
            $text = $text.Replace($needle, 'int INIT unxz')
            $changed = $true
          } elseif (-not $text.Contains('int INIT unxz')) {
            throw 'unxz() entry point was not found'
          }
          # MSVC already provides memmove. The pre-boot copy collides with it.
          $memmove = '#ifndef memmove'
          $memmoveNew = '#if !defined(memmove) && !defined(_MSC_VER)'
          if ($text.Contains($memmove) -and -not $text.Contains($memmoveNew)) {
            $text = $text.Replace($memmove, $memmoveNew)
            $changed = $true
          }
          if ($changed) {
            $utf8 = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::WriteAllText($src, $text, $utf8)
          }
          Write-Host "xz-embedded ready: $src"

      - name: Build Ventoy2Disk Win32 and x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found' }
          $install = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) |
            Where-Object { $_ -and $_.Trim() } |
            Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $install) { throw 'Visual C++ toolset was not found' }
          $install = $install.Trim()
          $msbuild = Join-Path $install 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe was not found under $install" }
          $names = @(Get-ChildItem -Path (Join-Path $install 'MSBuild\Microsoft\VC') -Recurse -Directory -Filter PlatformToolsets |
            ForEach-Object { Get-ChildItem -Path $_.FullName -Directory } |
            Where-Object { $_.Name -match '^v\d+$' } |
            Select-Object -ExpandProperty Name)
          $best = $null
          $bestN = -1
          foreach ($name in $names) {
            $n = [int]($name -replace '\D', '')
            if ($n -gt $bestN) { $bestN = $n; $best = $name }
          }
          if (-not $best) { throw "No MSVC platform toolset under $install" }
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $sdk = Get-ChildItem -Path $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+' } |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $sdk) { throw 'Windows 10 SDK was not found' }
          Write-Host "MSBuild=$msbuild"
          Write-Host "PlatformToolset=$best"
          Write-Host "WindowsTargetPlatformVersion=$sdk"
          foreach ($platform in @('Win32', 'x64')) {
            & $msbuild Ventoy2Disk\Ventoy2Disk.sln `
              /t:Build `
              /p:Configuration=Release `
              /p:Platform=$platform `
              /p:PlatformToolset=$best `
              /p:LanguageStandard_C=stdc17 `
              /p:SDLCheck=false `
              /p:WindowsTargetPlatformVersion=$sdk `
              /m `
              /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "msbuild $platform failed: $LASTEXITCODE" }
          }
          $exe32 = Get-ChildItem -Path Ventoy2Disk -Recurse -Filter Ventoy2Disk.exe |
            Where-Object { $_.FullName -match '\\Release\\' -and $_.DirectoryName -notmatch '\\x64\\' } |
            Select-Object -First 1
          $exe64 = Get-ChildItem -Path Ventoy2Disk -Recurse -Filter Ventoy2Disk_X64.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $exe32) { throw 'Ventoy2Disk.exe was not produced' }
          if (-not $exe64) { throw 'Ventoy2Disk_X64.exe was not produced' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $exe32.FullName artifacts\Ventoy2Disk.exe
          Copy-Item $exe64.FullName artifacts\Ventoy2Disk_X64.exe
          Get-Item artifacts\Ventoy2Disk.exe, artifacts\Ventoy2Disk_X64.exe | Format-List FullName, Length

      - name: Download the Linux installer payload
        uses: actions/download-artifact@v7
        with:
          pattern: ventoy-*-linux.tar.gz
          path: linux-pkg
          merge-multiple: true

      - name: Pack the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tar = Get-ChildItem -Path linux-pkg -Filter 'ventoy-*-linux.tar.gz' -File | Select-Object -First 1
          if (-not $tar) { throw 'Linux installer tarball was not downloaded' }
          $unpack = Join-Path (Get-Location) 'win-pack'
          New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          & tar.exe -xf $tar.FullName -C $unpack
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed: $LASTEXITCODE" }
          $dir = Get-ChildItem -Path $unpack -Directory -Filter 'ventoy-*' | Select-Object -First 1
          if (-not $dir) { throw 'Linux tarball has no ventoy-* directory' }
          foreach ($rel in @(
              'boot\boot.img',
              'boot\core.img.xz',
              'ventoy\ventoy.disk.img.xz',
              'ventoy\version',
              'plugin'
            )) {
            if (-not (Test-Path (Join-Path $dir.FullName $rel))) { throw "Linux package is missing $rel" }
          }
          foreach ($name in @('tool', 'WebUI')) {
            $path = Join-Path $dir.FullName $name
            if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
          Get-ChildItem -Path $dir.FullName -File | Where-Object {
            $_.Extension -eq '.sh' -or $_.Name -like 'VentoyGUI*' -or $_.Name -eq 'README'
          } | Remove-Item -Force
          Copy-Item LANGUAGES\languages.json (Join-Path $dir.FullName 'ventoy\languages.json')
          Copy-Item artifacts\Ventoy2Disk.exe (Join-Path $dir.FullName 'Ventoy2Disk.exe')
          $alt = Join-Path $dir.FullName 'altexe'
          New-Item -ItemType Directory -Force -Path $alt | Out-Null
          Copy-Item artifacts\Ventoy2Disk_X64.exe (Join-Path $alt 'Ventoy2Disk_X64.exe')
          Copy-Item INSTALL\FOR_X64_ARM.txt (Join-Path $dir.FullName 'FOR_X64_ARM.txt')
          $ver = (Get-Content (Join-Path $dir.FullName 'ventoy\version') -Raw).Trim()
          if (-not $ver) { throw 'ventoy/version is empty' }
          $zip = Join-Path (Get-Location) "artifacts\ventoy-$ver-windows.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          & tar.exe -a -cf $zip -C $unpack $dir.Name
          if ($LASTEXITCODE -ne 0) { throw "zip failed: $LASTEXITCODE" }
          $listing = @(& tar.exe -tf $zip | ForEach-Object { $_.Replace('\', '/') })
          if ($LASTEXITCODE -ne 0) { throw "tar list failed: $LASTEXITCODE" }
          foreach ($need in @(
              "$($dir.Name)/Ventoy2Disk.exe",
              "$($dir.Name)/altexe/Ventoy2Disk_X64.exe",
              "$($dir.Name)/boot/boot.img",
              "$($dir.Name)/boot/core.img.xz",
              "$($dir.Name)/ventoy/ventoy.disk.img.xz",
              "$($dir.Name)/ventoy/version",
              "$($dir.Name)/ventoy/languages.json"
            )) {
            if ($listing -notcontains $need) { throw "windows zip is missing $need" }
          }
          $plugin = "$($dir.Name)/plugin/"
          if (-not ($listing | Where-Object { $_.StartsWith($plugin) })) {
            throw "windows zip is missing $plugin"
          }
          Get-Item $zip | Format-List FullName, Length
          Write-Host "WINDOWS_ZIP=$zip"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ventoy-*-windows.zip
          archive: false
          if-no-files-found: error
