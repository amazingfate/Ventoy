name: Ventoy CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build GRUB, EDK2, and loongarch64
      run: docker compose run -T --rm --build trixie
    - name: Build the other installers and pack the release
      run: docker compose run -T --rm --build centos
    - uses: actions/upload-artifact@v4
      with:
        name: ventoy-windows
        path: INSTALL/ventoy-*windows*
    - uses: actions/upload-artifact@v4
      with:
        name: ventoy-linux
        path: INSTALL/ventoy-*linux*
    - uses: actions/upload-artifact@v4
      with:
        name: ventoy-livecd
        path: INSTALL/ventoy-*livecd*
    - uses: actions/upload-artifact@v4
      with:
        name: SHA256SUM
        path: INSTALL/sha256.txt
    - uses: actions/upload-artifact@v4
      with:
        name: xxx-build-log
        path: DOC/build.log
