<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Fallback faces for scripts that DejaVu does not cover</description>
  <!--
    Append, and keep the binding weak, so Latin stays on DejaVu.
    Noto Sans SC also contains Latin; a prefer rule would restyle the whole UI.
    Shared Han characters come from Noto Sans SC. Kana, hangul, and
    traditional-only characters still come from JP, KR, and TC.
  -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans SC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans TC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans JP</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans KR</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Thai</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Devanagari</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Bengali</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Tamil</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Malayalam</string></edit>
  </match>
</fontconfig>
